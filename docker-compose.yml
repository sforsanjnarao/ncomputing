# Optional: local Postgres + Redis for development if you would rather not
# point at Neon while building. Neon is what the deployed app uses for the
# database; Redis backs the background job queue and the catalogue cache.
#
#   docker compose up -d
#   DATABASE_URL="postgresql://ncomputing:ncomputing@localhost:5432/ncomputing"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ncomputing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ncomputing
      POSTGRES_PASSWORD: ncomputing
      POSTGRES_DB: ncomputing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ncomputing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
